name: CI - Backend

on:
  push:
    branches: [main]
    paths:
      - "PRN232_BE/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "PRN232_BE/**"
      - ".github/workflows/ci-backend.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PRN232_BE

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Bật lại khi nhóm có test project (dotnet new xunit) thật sự.
      # - name: Test
      #   run: dotnet test --no-build --configuration Release
